    :root{--bg:#e8f4fd;--bg-card:#ffffff;--bg-card-hover:#f0f8ff;--text-primary:#1a2a3a;--text-secondary:#4a6070;--text-muted:#90a8b8;--accent:#1a73e8;--accent-dim:#4a90d9;--accent-light:rgba(26,115,232,0.08);--border:#d0e8f8;--border-light:#e0f0fa;--tag-china:#2e7d4f;--tag-world:#1565c0;--tag-science:#7b1fa2;--tag-culture:#b45309;--tag-military:#c62828;--shadow:0 2px 12px rgba(26,115,232,0.08);--shadow-hover:0 6px 24px rgba(26,115,232,0.14)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text-primary);font-family:'Noto Serif SC',serif;min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 20% 0%,rgba(26,115,232,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(26,115,232,0.05) 0%,transparent 50%)}
    ::selection{background:rgba(26,115,232,0.15);color:var(--text-primary)}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(232,244,253,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .nav-brand{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--text-primary);letter-spacing:0.05em;text-decoration:none}
    .nav-brand span{color:var(--accent)}
    .date-picker{display:flex;align-items:center;gap:0.6rem}
    .month-select,.day-select{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-family:'JetBrains Mono',monospace;font-size:0.78rem;cursor:pointer;outline:none;transition:border-color 0.2s,box-shadow 0.2s;appearance:none;-webkit-appearance:none;box-shadow:var(--shadow)}
    .month-select:focus,.day-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,115,232,0.1)}
    .month-select option,.day-select option{background:#f0f8ff}
    .go-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0.4rem 1rem;font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.2s ease;box-shadow:var(--shadow)}
    .go-btn:hover{background:#1557c0;transform:translateY(-1px);box-shadow:var(--shadow-hover)}
    .go-btn:active{transform:translateY(0)}
    .today-btn{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.8rem;font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.2s ease}
    .today-btn:hover{color:var(--accent);border-color:var(--accent)}
    .hero{min-height:48vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:7rem 2rem 3rem;position:relative}
    .hero::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:1px;height:60px;background:linear-gradient(to bottom,transparent,var(--accent-light));animation:pulse-line 2.5s ease-in-out infinite}
    @keyframes pulse-line{0%,100%{opacity:0.4}50%{opacity:1}}
    .hero-date-label{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.4em;color:var(--accent);text-transform:uppercase;margin-bottom:1.5rem;opacity:0;animation:fade-up 0.8s ease-out 0.2s forwards}
    .hero-title{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,8vw,5.5rem);font-weight:700;line-height:1.05;letter-spacing:-0.02em;color:var(--text-primary);opacity:0;animation:fade-up 0.9s ease-out 0.4s forwards}
    .hero-subtitle{font-size:1rem;font-weight:300;color:var(--text-secondary);margin-top:1rem;letter-spacing:0.12em;opacity:0;animation:fade-up 0.8s ease-out 0.7s forwards}
    .hero-meta{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);margin-top:0.75rem;letter-spacing:0.2em;opacity:0;animation:fade-up 0.8s ease-out 0.9s forwards}
    @keyframes fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .stats-bar{display:flex;justify-content:center;gap:4rem;padding:2.5rem 2rem;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(255,255,255,0.5);opacity:0;animation:fade-up 0.8s ease-out 1.1s forwards}
    .stat{text-align:center}
    .stat-num{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:700;color:var(--accent)}
    .stat-label{font-size:0.65rem;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase;margin-top:0.3rem}
    .tabs{display:flex;justify-content:center;gap:0;margin:2.5rem 0 0;border-bottom:1px solid var(--border);opacity:0;animation:fade-up 0.8s ease-out 1.2s forwards}

    .tab:hover{color:var(--text-secondary)}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

    .section-title{font-size:0.7rem;letter-spacing:0.3em;color:var(--text-muted);text-transform:uppercase}
    .section-line{flex:1;height:1px;background:var(--border)}
    .timeline{position:relative;padding-left:2.8rem}
    .timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--border-light) 8%,var(--border-light) 92%,transparent)}

    .event:hover{background:var(--bg-card-hover);border-color:rgba(26,115,232,0.2);transform:translateX(4px);box-shadow:var(--shadow-hover)}

    .event-title{font-size:0.98rem;font-weight:600;color:var(--text-primary);line-height:1.6;margin-bottom:0.4rem}
    .event-desc{font-size:0.85rem;font-weight:300;color:var(--text-secondary);line-height:1.8}
    .event-tags{display:flex;gap:0.4rem;margin-top:0.6rem;flex-wrap:wrap}

    .tag-world{background:rgba(21,101,192,0.1);color:var(--tag-world);border:1px solid rgba(21,101,192,0.2)}
    .tag-science{background:rgba(123,31,162,0.1);color:var(--tag-science);border:1px solid rgba(123,31,162,0.2)}
    .tag-culture{background:rgba(180,83,9,0.1);color:var(--tag-culture);border:1px solid rgba(180,83,9,0.2)}
    .tag-military{background:rgba(198,40,40,0.1);color:var(--tag-military);border:1px solid rgba(198,40,40,0.2)}
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;gap:1.5rem}

    .loading-text{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.2em;color:var(--text-muted);text-transform:uppercase}
    .empty-state{text-align:center;padding:4rem 2rem;color:var(--text-muted);font-size:0.9rem}

  </style>

  function setMD(m,d){currentMonth=m;currentDay=d;var mSel=document.getElementById("monthSelect"),dSel=document.getElementById("daySelect");mSel.value=m;updateDays(m);dSel.value=d}
  function load(){document.getElementById("heroSubtitle").textContent=MONTHS_CN[currentMonth-1]+" "+currentDay+" 日";document.getElementById("heroMeta").textContent=MONTHS_EN[currentMonth-1]+" "+currentDay;var data=getMonthData(currentMonth,currentDay);if(data){document.getElementById("statEvents").textContent=(data.events||[]).length;document.getElementById("statBirths").textContent=(data.births||[]).length;document.getElementById("statDeaths").textContent=0}else{document.getElementById("statEvents").textContent=0;document.getElementById("statBirths").textContent=0;document.getElementById("statDeaths").textContent=0}render()}
  function render(){document.getElementById("sectionTitle").textContent=SECTION_TITLES[currentType];var data=getMonthData(currentMonth,currentDay);if(!data||!data[currentType]||data[currentType].length===0){document.getElementById("timeline").innerHTML='<div class="empty-state">暂无数据</div>';return}var items=data[currentType];if(currentType==="selected")items=items.filter(function(x){return!!x.year});if(items.length===0){document.getElementById("timeline").innerHTML='<div class="empty-state">暂无数据</div>';return}var html="";for(var i=0;i<items.length;i++){var it=items[i],tag=(it.cls||"world"),delay=i*0.04+"s";if(currentType==="selected"){html+='<div class="event" style="transition-delay:'+delay+'"><div class="event-year">'+it.year+'</div><div class="event-title">'+it.text+'</div><div class="event-tags"><span class="tag tag-'+tag+'">'+TAG_LABELS[tag]+'</span></div></div>'}else{var label=currentType==="births"?"出生":"邺途";html+='<div class="event" style="transition-delay:'+delay+'"><div class="event-year">'+it.year+' · '+label+'</div><div class="event-title">'+(it.name||it.text||'')+'</div>'+(it.desc?'<div class="event-desc">'+it.desc+'</div>':'')+'</div>'}}document.getElementById("timeline").innerHTML=html;setTimeout(function(){var obs=new IntersectionObserver(function(ents){for(var i=0;i<ents.length;i++)if(ents[i].isIntersecting)ents[i].target.classList.add("visible")},{threshold:0.08,rootMargin:"0px 0px -30px 0px"});var evs=document.querySelectorAll(".event");for(var i=0;i<evs.length;i++){evs[i].style.transitionDelay=i*0.04+"s";obs.observe(evs[i])}},10)}
  init()
})();
</script>
