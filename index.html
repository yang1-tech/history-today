<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史上的今天</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-card: #111111;
      --bg-card-hover: #181818;
      --text-primary: #e8e0d0;
      --text-secondary: #8a8070;
      --text-muted: #4a4540;
      --accent: #c9a96e;
      --accent-dim: #8a6e3e;
      --border: #1e1c18;
      --border-light: #282418;
      --tag-china: #7a9e7a;
      --tag-world: #6e8ab8;
      --tag-science: #9e7aad;
      --tag-culture: #c49a6c;
      --tag-military: #ad6e6e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Serif SC', serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.022;
      pointer-events: none;
      z-index: 1000;
    }

    ::selection { background: var(--accent); color: var(--bg); }

    /* ─── Nav ─── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .nav-brand span { color: var(--accent); }

    .date-picker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .month-select, .day-select {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      border-radius: 3px;
      padding: 0.45rem 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    .month-select:focus, .day-select:focus {
      border-color: var(--accent-dim);
    }

    .month-select option, .day-select option {
      background: #1a1a1a;
    }

    .go-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 3px;
      padding: 0.45rem 1.1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .go-btn:hover {
      background: #d4b87a;
      transform: translateY(-1px);
    }

    .go-btn:active { transform: translateY(0); }

    .today-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-light);
      border-radius: 3px;
      padding: 0.45rem 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .today-btn:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    /* ─── Hero ─── */
    .hero {
      min-height: 52vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 7rem 2rem 3rem;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, var(--accent-dim));
      animation: pulse-line 2.5s ease-in-out infinite;
    }

    @keyframes pulse-line {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .hero-date-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.2s forwards;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 6.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0;
      animation: fade-up 0.9s ease-out 0.4s forwards;
    }

    .hero-subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-top: 1rem;
      letter-spacing: 0.12em;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.7s forwards;
    }

    .hero-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fade-up 0.8s ease-out 0.9s forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Stats ─── */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 4rem;
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      opacity: 0;
      animation: fade-up 0.8s ease-out 1.1s forwards;
    }

    .stat { text-align: center; }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* ─── Tabs ─── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 2.5rem 0 0;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      animation: fade-up 0.8s ease-out 1.2s forwards;
    }

    .tab {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .tab:hover { color: var(--text-secondary); }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ─── Timeline ─── */
    .timeline-section {
      max-width: 880px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .section-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.2em;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .timeline {
      position: relative;
      padding-left: 2.8rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--border-light) 8%, var(--border-light) 92%, transparent);
    }

    .event {
      position: relative;
      margin-bottom: 2rem;
      padding: 1.25rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 2px;
      transition: all 0.25s ease;
      opacity: 0;
      transform: translateX(16px);
    }

    .event.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .event::before {
      content: '';
      position: absolute;
      left: -2.8rem;
      top: 1.5rem;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--accent-dim);
      transition: all 0.25s ease;
    }

    .event:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateX(4px);
    }

    .event:hover::before {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(201, 169, 110, 0.4);
    }

    .event-year {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .event-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.55;
      margin-bottom: 0.5rem;
    }

    .event-desc {
      font-size: 0.855rem;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.85;
    }

    .event-link {
      display: inline-block;
      margin-top: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--accent-dim);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .event-link:hover { color: var(--accent); }

    .event-tags {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.65rem;
      flex-wrap: wrap;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      padding: 0.18rem 0.5rem;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .tag-china { background: rgba(122,158,122,0.1); color: var(--tag-china); border: 1px solid rgba(122,158,122,0.18); }
    .tag-world { background: rgba(110,138,184,0.1); color: var(--tag-world); border: 1px solid rgba(110,138,184,0.18); }
    .tag-science { background: rgba(158,122,173,0.1); color: var(--tag-science); border: 1px solid rgba(158,122,173,0.18); }
    .tag-culture { background: rgba(196,154,108,0.1); color: var(--tag-culture); border: 1px solid rgba(196,154,108,0.18); }
    .tag-military { background: rgba(173,110,110,0.1); color: var(--tag-military); border: 1px solid rgba(173,110,110,0.18); }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
      gap: 1.5rem;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ─── Error ─── */
    .error-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .error-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .error-msg {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* ─── Empty ─── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ─── Footer ─── */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }

    footer a { color: var(--accent-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .nav { padding: 1rem 1.25rem; gap: 0.5rem; }
      .hero { padding: 6rem 1.25rem 2.5rem; }
      .stats-bar { gap: 2.5rem; padding: 2rem 1.25rem; }
      .timeline { padding-left: 1.8rem; }
      .timeline::before { left: 0; }
      .event::before { left: -1.8rem; }
      .timeline-section { padding: 2rem 1.25rem 4rem; }
      .tabs { overflow-x: auto; justify-content: flex-start; padding: 0 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="#" class="nav-brand" onclick="location.reload()">HIST<span>📜</span>RY</a>
    <div class="date-picker">
      <select class="month-select" id="monthSelect"></select>
      <select class="day-select" id="daySelect"></select>
      <button class="go-btn" id="goBtn">查看</button>
      <button class="today-btn" id="todayBtn">今日</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-date-label">HISTORY · ON THIS DAY</div>
    <h1 class="hero-title" id="heroTitle">历史上的今天</h1>
    <p class="hero-subtitle" id="heroSubtitle">4 月 25 日</p>
    <p class="hero-meta" id="heroMeta">April 25</p>
  </section>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <div class="stat-num" id="statEvents">—</div>
      <div class="stat-label">历史事件</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statBirths">—</div>
      <div class="stat-label">出生人物</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statDeaths">—</div>
      <div class="stat-label">逝世人物</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-type="selected">历史事件</button>
    <button class="tab" data-type="births">今日出生</button>
    <button class="tab" data-type="deaths">今日逝世</button>
  </div>

  <!-- Timeline -->
  <section class="timeline-section">
    <div class="section-header">
      <span class="section-number">01</span>
      <span class="section-title" id="sectionTitle">历史长河</span>
      <div class="section-line"></div>
    </div>
    <div class="timeline" id="timeline">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载历史数据…</div>
      </div>
    </div>
  </section>

  <footer>
    数据来源：<a href="https://wikimedia.org" target="_blank" rel="noopener">Wikimedia API</a> · 由 Wikipedia 提供
  </footer>

  <script>
    // ─── Month names ───
    const MONTHS_CN  = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    const MONTHS_EN  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_MONTH = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    // ─── State ───
    let currentMonth = 4;
    let currentDay   = 25;
    let currentType  = 'selected';
    let cachedData   = {};

    // ─── Init ───
    const today = new Date();
    const curMonth = today.getMonth() + 1;
    const curDay   = today.getDate();

    function init() {
      buildSelects();
      document.getElementById('todayBtn').addEventListener('click', () => {
        setMonthDay(curMonth, curDay);
        loadData();
      });
      document.getElementById('goBtn').addEventListener('click', loadData);
      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentType = btn.dataset.type;
          renderEvents(currentType);
        });
      });
      document.getElementById('monthSelect').addEventListener('change', onMonthChange);
      loadData();
    }

    function buildSelects() {
      const mSel = document.getElementById('monthSelect');
      const dSel = document.getElementById('daySelect');
      MONTHS_CN.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1;
        opt.textContent = name;
        mSel.appendChild(opt);
      });
      updateDaySelect(currentMonth);
      mSel.value = currentMonth;
      dSel.value = currentDay;
    }

    function updateDaySelect(month) {
      const dSel = document.getElementById('daySelect');
      dSel.innerHTML = '';
      for (let d = 1; d <= DAYS_MONTH[month - 1]; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + ' 日';
        dSel.appendChild(opt);
      }
    }

    function onMonthChange() {
      currentMonth = parseInt(document.getElementById('monthSelect').value);
      updateDaySelect(currentMonth);
    }

    function setMonthDay(m, d) {
      currentMonth = m;
      currentDay   = d;
      document.getElementById('monthSelect').value = m;
      document.getElementById('monthSelect').dispatchEvent(new Event('change'));
      document.getElementById('daySelect').value   = d;
    }

    function mmdd(month, day) {
      return `${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    // ─── Fetch ───
    async function loadData() {
      const mm = mmdd(currentMonth, currentDay);
      updateHero();
      showLoading();
      try {
        const [zhRes, enRes] = await Promise.all([
          fetch(`https://api.wikimedia.org/feed/v1/wikipedia/zh-cn/onthisday/all/${mm}`),
          fetch(`https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${mm}`)
        ]);
        if (!zhRes.ok || !enRes.ok) throw new Error('API 请求失败');
        const zh = await zhRes.json();
        const en = enRes.ok ? await enRes.json() : {};
        cachedData = { zh, en };
        updateStats(zh);
        renderEvents(currentType);
      } catch (err) {
        showError();
        console.error(err);
      }
    }

    function updateHero() {
      document.getElementById('heroSubtitle').textContent = `${MONTHS_CN[currentMonth-1]} ${currentDay} 日`;
      document.getElementById('heroMeta').textContent = `${MONTHS_EN[currentMonth-1]} ${currentDay}`;
    }

    function updateStats(data) {
      document.getElementById('statEvents').textContent = (data.events || []).length;
      document.getElementById('statBirths').textContent = (data.births || []).length;
      document.getElementById('statDeaths').textContent = (data.deaths || []).length;
    }

    // ─── Render ───
    function showLoading() {
      document.getElementById('timeline').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <div class="loading-text">正在加载…</div>
        </div>`;
    }

    function showError() {
      document.getElementById('timeline').innerHTML = `
        <div class="error-state">
          <div class="error-icon">⚠</div>
          <div class="error-msg">无法加载数据，请检查网络连接后重试</div>
        </div>`;
    }

    function renderEvents(type) {
      const { zh, en } = cachedData;
      if (!zh) return showError();

      const sectionTitles = {
        selected: '历史长河',
        births:   '今日出生',
        deaths:   '今日逝世'
      };
      document.getElementById('sectionTitle').textContent = sectionTitles[type] || '';

      let items = zh[type] || [];

      // For events, keep only items with year info
      if (type === 'selected') {
        items = items.filter(it => it.year);
      }

      if (items.length === 0) {
        document.getElementById('timeline').innerHTML = `
          <div class="empty-state">暂无数据</div>`;
        return;
      }

      const html = items.map((it, i) => {
        if (type === 'selected') {
          return renderEvent(it, i);
        } else if (type === 'births' || type === 'deaths') {
          return renderPerson(it, type, i);
        }
      }).join('');

      document.getElementById('timeline').innerHTML = html;

      // Observe
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.event').forEach((el, i) => {
        el.style.transitionDelay = `${i * 0.04}s`;
        observer.observe(el);
      });
    }

    function renderEvent(it, i) {
      const year  = it.year || '';
      const text  = it.text || '';
      // Find English text for bilingual
      const enItem = (cachedData.en?.selected || []).find(e => e.year === it.year);
      const enText = enItem?.text || '';
      const desc   = text;
      const tag    = classifyEvent(text, year);
      const link   = (it.pages || [])[0];
      const linkUrl = link?.content_urls?.desktop?.page || '';
      const linkTxt = link?.lang || 'zh';

      return `
        <div class="event" style="transition-delay:${i*0.04}s">
          <div class="event-year">${year}</div>
          <div class="event-title">${desc}</div>
          ${enText && enText !== text ? `<div class="event-desc" style="color:var(--text-muted);font-style:italic;font-size:0.82rem;margin-top:0.2rem">${enText}</div>` : ''}
          ${linkUrl ? `<a class="event-link" href="${linkUrl}" target="_blank" rel="noopener">维基百科 →</a>` : ''}
          <div class="event-tags"><span class="tag tag-${tag.cls}">${tag.label}</span></div>
        </div>`;
    }

    function renderPerson(it, type, i) {
      const year  = it.year || '';
      const name  = it.text || it.name || '';
      const desc  = it.description || '';
      const tag   = type === 'births' ? 'culture' : 'world';
      const enItem = ((type === 'births' ? cachedData.en?.births : cachedData.en?.deaths) || [])
                      .find(e => e.year === it.year && (e.text === it.text || e.text?.includes(name)));
      const enName = enItem?.text || '';
      const link   = (it.pages || [])[0];
      const linkUrl = link?.content_urls?.desktop?.page || '';

      return `
        <div class="event" style="transition-delay:${i*0.04}s">
          <div class="event-year">${year} · ${type === 'births' ? '出生' : '逝世'}</div>
          <div class="event-title">${name}</div>
          ${desc ? `<div class="event-desc">${desc}</div>` : ''}
          ${enName && enName !== name ? `<div class="event-desc" style="color:var(--text-muted);font-style:italic;font-size:0.82rem;margin-top:0.2rem">${enName}</div>` : ''}
          ${linkUrl ? `<a class="event-link" href="${linkUrl}" target="_blank" rel="noopener">维基百科 →</a>` : ''}
          <div class="event-tags"><span class="tag tag-${tag}">${type === 'births' ? '人物' : '逝世'}</span></div>
        </div>`;
    }

    // ─── Classify event by keywords ───
    function classifyEvent(text, year) {
      const s = text.toLowerCase();
      if (/中国|中华|清朝|明朝|民国|新中国|共产党|毛泽东|周恩来|林彪|蒋介石|袁世凯|李鸿章|周恩来|史可法|延安|中共/.test(s))
        return { cls: 'china',   label: '中国史' };
      if (/战争|军|兵|师|旅|团|营|连|排|战役|战役|法西斯|纳粹|希特勒|盟军|苏军|美军|德军|日军|解放|起义|革命|抗/.test(s))
        return { cls: 'military', label: '军事' };
      if (/科学|发现|发明|技术|卫星|飞船|核|物理|化学|医学|生物|DNA|计算机|互联网/.test(s))
        return { cls: 'science', label: '科技' };
      if (/音乐|文学|艺术|画家|诗人|作家|小说|小说家|指挥|音乐家|雕刻|建筑|剧院|电影|摄影/.test(s))
        return { cls: 'culture', label: '文化' };
      return { cls: 'world', label: '世界史' };
    }

    // ─── Start ───
    init();
  </script>

</body>
</html>
