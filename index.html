    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text-primary);font-family:'Noto Serif SC',serif;min-height:100vh;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at 20% 0%,rgba(26,115,232,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(26,115,232,0.05) 0%,transparent 50%)}

    .nav-brand{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--text-primary);letter-spacing:0.05em;text-decoration:none}

    .date-picker{display:flex;align-items:center;gap:0.6rem}
    .month-select,.day-select{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;font-family:'JetBrains Mono',monospace;font-size:0.78rem;cursor:pointer;outline:none;transition:border-color 0.2s,box-shadow 0.2s;appearance:none;-webkit-appearance:none;box-shadow:var(--shadow)}

    .today-btn:hover{color:var(--accent);border-color:var(--accent)}
    .hero{min-height:48vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:7rem 2rem 3rem;position:relative}

    .hero-title{font-family:'Playfair Display',serif;font-size:clamp(2.8rem,8vw,5.5rem);font-weight:700;line-height:1.05;letter-spacing:-0.02em;color:var(--text-primary);opacity:0;animation:fade-up 0.9s ease-out 0.4s forwards}
    .hero-subtitle{font-size:1rem;font-weight:300;color:var(--text-secondary);margin-top:1rem;letter-spacing:0.12em;opacity:0;animation:fade-up 0.8s ease-out 0.7s forwards}
    .hero-meta{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);margin-top:0.75rem;letter-spacing:0.2em;opacity:0;animation:fade-up 0.8s ease-out 0.9s forwards}

    .tag-military{background:rgba(198,40,40,0.1);color:var(--tag-military);border:1px solid rgba(198,40,40,0.2)}

<script>
(function(){
  var MONTHS_CN=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  var MONTHS_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAYS_MONTH=[31,29,31,30,31,30,31,31,30,31,30,31];
  var TAG_LABELS={"china":"中国史","world":"世界史","military":"军事","science":"科技","culture":"文化"};
  var SECTION_TITLES={"selected":"历史长河","births":"今日出生","deaths":"今日邺途"};
  var currentMonth=1,currentDay=1,currentType="selected";

  // KEY: 查找月份数据，ALL_DATA["04"] 有事件
  function getMonthData(m,d){
    var key=String(m).length<2?"0"+m:String(m);
    return ALL_DATA[key]||null;
  }

  function init(){
    var mSel=document.getElementById("monthSelect"),dSel=document.getElementById("daySelect");
    for(var i=0;i<12;i++){var o=document.createElement("option");o.value=i+1;o.textContent=MONTHS_CN[i];mSel.appendChild(o)}
    updateDays(currentMonth);mSel.value=currentMonth;dSel.value=currentDay;
    document.getElementById("todayBtn").onclick=function(){var t=new Date();setMD(t.getMonth()+1,t.getDate());load()};
    document.getElementById("goBtn").onclick=load;
    document.getElementById("monthSelect").onchange=function(){currentMonth=parseInt(this.value);updateDays(currentMonth)};
    var tabs=document.querySelectorAll(".tab");
    for(var i=0;i<tabs.length;i++)(function(btn){btn.onclick=function(){for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");btn.classList.add("active");currentType=btn.getAttribute("data-type");render()}})(tabs[i]);
    load()
  }

  function updateDays(m){var dSel=document.getElementById("daySelect");dSel.innerHTML="";for(var i=1;i<=DAYS_MONTH[m-1];i++){var o=document.createElement("option");o.value=i;o.textContent=i+" 日";dSel.appendChild(o)}}
  function setMD(m,d){currentMonth=m;currentDay=d;var mSel=document.getElementById("monthSelect"),dSel=document.getElementById("daySelect");mSel.value=m;updateDays(m);dSel.value=d}
  function load(){
    document.getElementById("heroSubtitle").textContent=MONTHS_CN[currentMonth-1]+" "+currentDay+" 日";
    document.getElementById("heroMeta").textContent=MONTHS_EN[currentMonth-1]+" "+currentDay;
    var data=getMonthData(currentMonth,currentDay);
    if(data){
      document.getElementById("statEvents").textContent=(data.events||[]).length;
      document.getElementById("statBirths").textContent=(data.births||[]).length;
      document.getElementById("statDeaths").textContent=0;
    }else{
      document.getElementById("statEvents").textContent=0;
      document.getElementById("statBirths").textContent=0;
      document.getElementById("statDeaths").textContent=0;
    }
    render();
  }
  function render(){
    document.getElementById("sectionTitle").textContent=SECTION_TITLES[currentType];
    var data=getMonthData(currentMonth,currentDay);
    if(!data||!data[currentType]||data[currentType].length===0){
      document.getElementById("timeline").innerHTML='<div class="empty-state">暂无数据</div>';return;
    }
    var items=data[currentType];
    if(currentType==="selected")items=items.filter(function(x){return!!x.year});
    if(items.length===0){
      document.getElementById("timeline").innerHTML='<div class="empty-state">暂无数据</div>';return;
    }
    var html="";
    for(var i=0;i<items.length;i++){
      var it=items[i],tag=(it.cls||"world"),delay=i*0.04+"s";
      if(currentType==="selected"){
        html+='<div class="event" style="transition-delay:'+delay+'"><div class="event-year">'+it.year+'</div><div class="event-title">'+it.text+'</div><div class="event-tags"><span class="tag tag-'+tag+'">'+TAG_LABELS[tag]+'</span></div></div>';
      }else{
        var label=currentType==="births"?"出生":"邺途";
        html+='<div class="event" style="transition-delay:'+delay+'"><div class="event-year">'+it.year+' \u00b7 '+label+'</div><div class="event-title">'+(it.name||it.text||'')+'</div>'+(it.desc?'<div class="event-desc">'+it.desc+'</div>':'')+'</div>';
      }
    }
    document.getElementById("timeline").innerHTML=html;
    setTimeout(function(){
      var obs=new IntersectionObserver(function(ents){for(var i=0;i<ents.length;i++)if(ents[i].isIntersecting)ents[i].target.classList.add("visible")},{threshold:0.08,rootMargin:"0px 0px -30px 0px"});
      var evs=document.querySelectorAll(".event");
      for(var i=0;i<evs.length;i++){evs[i].style.transitionDelay=i*0.04+"s";obs.observe(evs[i])}
    },10)
  }
  init()
})();
</script>
</body>
