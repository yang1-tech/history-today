<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史上的今天</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8f4fd;
      --bg-card: #ffffff;
      --bg-card-hover: #f0f8ff;
      --text-primary: #1a2a3a;
      --text-secondary: #4a6070;
      --text-muted: #90a8b8;
      --accent: #1a73e8;
      --accent-dim: #4a90d9;
      --accent-light: rgba(26,115,232,0.08);
      --border: #d0e8f8;
      --border-light: #e0f0fa;
      --tag-china: #2e7d4f;
      --tag-world: #1565c0;
      --tag-science: #7b1fa2;
      --tag-culture: #b45309;
      --tag-military: #c62828;
      --shadow: 0 2px 12px rgba(26,115,232,0.08);
      --shadow-hover: 0 6px 24px rgba(26,115,232,0.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Serif SC', serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(26,115,232,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(26,115,232,0.05) 0%, transparent 50%);
    }
    ::selection { background: rgba(26,115,232,0.15); color: var(--text-primary); }
    /* Nav */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(232,244,253,0.88);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; color: var(--text-primary);
      letter-spacing: 0.05em; text-decoration: none;
    }
    .nav-brand span { color: var(--accent); }
    .date-picker { display: flex; align-items: center; gap: 0.6rem; }
    .month-select, .day-select {
      background: var(--bg-card); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.4rem 0.7rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem; cursor: pointer; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none; -webkit-appearance: none;
      box-shadow: var(--shadow);
    }
    .month-select:focus, .day-select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
    }
    .month-select option, .day-select option { background: #f0f8ff; }
    .go-btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 0.4rem 1rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      letter-spacing: 0.08em; cursor: pointer;
      transition: all 0.2s ease; box-shadow: var(--shadow);
    }
    .go-btn:hover { background: #1557c0; transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .go-btn:active { transform: translateY(0); }
    .today-btn {
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.4rem 0.8rem; font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.08em; cursor: pointer;
      transition: all 0.2s ease;
    }
    .today-btn:hover { color: var(--accent); border-color: var(--accent); }
    /* Hero */
    .hero {
      min-height: 48vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 7rem 2rem 3rem; position: relative;
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 1px; height: 60px;
      background: linear-gradient(to bottom, transparent, var(--accent-light));
      animation: pulse-line 2.5s ease-in-out infinite;
    }
    @keyframes pulse-line { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .hero-date-label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
      letter-spacing: 0.4em; color: var(--accent);
      text-transform: uppercase; margin-bottom: 1.5rem;
      opacity: 0; animation: fade-up 0.8s ease-out 0.2s forwards;
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem); font-weight: 700;
      line-height: 1.05; letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0; animation: fade-up 0.9s ease-out 0.4s forwards;
    }
    .hero-subtitle {
      font-size: 1rem; font-weight: 300; color: var(--text-secondary);
      margin-top: 1rem; letter-spacing: 0.12em;
      opacity: 0; animation: fade-up 0.8s ease-out 0.7s forwards;
    }
    .hero-meta {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      color: var(--text-muted); margin-top: 0.75rem; letter-spacing: 0.2em;
      opacity: 0; animation: fade-up 0.8s ease-out 0.9s forwards;
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    /* Stats */
    .stats-bar {
      display: flex; justify-content: center; gap: 4rem;
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.5);
      opacity: 0; animation: fade-up 0.8s ease-out 1.1s forwards;
    }
    .stat { text-align: center; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; margin-top: 0.3rem; }
    /* Tabs */
    .tabs {
      display: flex; justify-content: center; gap: 0; margin: 2.5rem 0 0;
      border-bottom: 1px solid var(--border);
      opacity: 0; animation: fade-up 0.8s ease-out 1.2s forwards;
    }
    .tab {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase;
      padding: 0.75rem 1.5rem; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* Timeline */
    .timeline-section { max-width: 880px; margin: 0 auto; padding: 3rem 2rem 6rem; }
    .section-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2.5rem; }
    .section-number { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--accent); letter-spacing: 0.2em; }
    .section-title { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; }
    .section-line { flex: 1; height: 1px; background: var(--border); }
    .timeline { position: relative; padding-left: 2.8rem; }
    .timeline::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
      background: linear-gradient(to bottom, transparent, var(--border-light) 8%, var(--border-light) 92%, transparent);
    }
    .event {
      position: relative; margin-bottom: 1.6rem; padding: 1.2rem 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow);
      transition: all 0.25s ease;
      opacity: 0; transform: translateX(16px);
    }
    .event.visible { opacity: 1; transform: translateX(0); }
    .event::before {
      content: ''; position: absolute; left: -2.8rem; top: 1.5rem;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg-card);
      box-shadow: 0 0 0 1.5px var(--accent);
      transition: all 0.25s ease;
    }
    .event:hover {
      background: var(--bg-card-hover); border-color: rgba(26,115,232,0.2);
      transform: translateX(4px); box-shadow: var(--shadow-hover);
    }
    .event:hover::before {
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(26,115,232,0.3);
    }
    .event-year { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 0.4rem; }
    .event-title { font-size: 0.98rem; font-weight: 600; color: var(--text-primary); line-height: 1.6; margin-bottom: 0.4rem; }
    .event-desc { font-size: 0.85rem; font-weight: 300; color: var(--text-secondary); line-height: 1.8; }
    .event-link { display: inline-block; margin-top: 0.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.63rem; letter-spacing: 0.08em; color: var(--accent-dim); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
    .event-link:hover { color: var(--accent); }
    .event-tags { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; letter-spacing: 0.06em; padding: 0.18rem 0.5rem; border-radius: 20px; text-transform: uppercase; }
    .tag-china { background: rgba(46,125,79,0.1); color: var(--tag-china); border: 1px solid rgba(46,125,79,0.2); }
    .tag-world { background: rgba(21,101,192,0.1); color: var(--tag-world); border: 1px solid rgba(21,101,192,0.2); }
    .tag-science { background: rgba(123,31,162,0.1); color: var(--tag-science); border: 1px solid rgba(123,31,162,0.2); }
    .tag-culture { background: rgba(180,83,9,0.1); color: var(--tag-culture); border: 1px solid rgba(180,83,9,0.2); }
    .tag-military { background: rgba(198,40,40,0.1); color: var(--tag-military); border: 1px solid rgba(198,40,40,0.2); }
    /* Loading */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 2rem; gap: 1.5rem; }
    .loading-spinner { width: 28px; height: 28px; border: 2px solid var(--border-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }
    /* Error */
    .error-state { text-align: center; padding: 4rem 2rem; }
    .error-icon { font-size: 2rem; margin-bottom: 1rem; }
    .error-msg { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.7; }
    /* Empty */
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); font-size: 0.9rem; }
    /* Footer */
    footer { text-align: center; padding: 3rem 2rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.1em; }
    footer a { color: var(--accent-dim); text-decoration: none; }
    footer a:hover { color: var(--accent); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    /* Responsive */
    @media (max-width: 640px) {
      .nav { padding: 1rem 1.25rem; gap: 0.5rem; }
      .hero { padding: 6rem 1.25rem 2.5rem; }
      .stats-bar { gap: 2.5rem; padding: 2rem 1.25rem; }
      .timeline { padding-left: 1.8rem; }
      .timeline::before { left: 0; }
      .event::before { left: -1.8rem; }
      .timeline-section { padding: 2rem 1.25rem 4rem; }
      .tabs { overflow-x: auto; justify-content: flex-start; padding: 0 1.25rem; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="nav-brand" onclick="location.reload()">HIST<span>📜</span>RY</a>
    <div class="date-picker">
      <select class="month-select" id="monthSelect"></select>
      <select class="day-select" id="daySelect"></select>
      <button class="go-btn" id="goBtn">查看</button>
      <button class="today-btn" id="todayBtn">今日</button>
    </div>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-date-label">HISTORY · ON THIS DAY</div>
    <h1 class="hero-title" id="heroTitle">历史上的今天</h1>
    <p class="hero-subtitle" id="heroSubtitle">4 月 25 日</p>
    <p class="hero-meta" id="heroMeta">April 25</p>
  </section>

  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="stat-num" id="statEvents">—</div><div class="stat-label">历史事件</div></div>
    <div class="stat"><div class="stat-num" id="statBirths">—</div><div class="stat-label">出生人物</div></div>
    <div class="stat"><div class="stat-num" id="statDeaths">—</div><div class="stat-label">逝世人物</div></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-type="selected">历史事件</button>
    <button class="tab" data-type="births">今日出生</button>
    <button class="tab" data-type="deaths">今日逝世</button>
  </div>

  <section class="timeline-section">
    <div class="section-header">
      <span class="section-number">01</span>
      <span class="section-title" id="sectionTitle">历史长河</span>
      <div class="section-line"></div>
    </div>
    <div class="timeline" id="timeline">
      <div class="loading"><div class="loading-spinner"></div><div class="loading-text">正在加载…</div></div>
    </div>
  </section>

  <footer>历史长河 · 时光回眸 · 精选历史事件</footer>

<script>
// Embed the ALL_DATA directly
const ALL_DATA = undefined;
</script>
<script>
(function() {
    const MONTHS_CN  = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    const MONTHS_EN  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_MONTH = [31,29,31,30,31,30,31,31,30,31,30,31];

    let currentMonth = 4;
    let currentDay   = 25;
    let currentType  = 'selected';

    function init() {
      buildSelects();
      document.getElementById('todayBtn').addEventListener('click', () => {
        const t = new Date();
        setMonthDay(t.getMonth()+1, t.getDate());
        loadData();
      });
      document.getElementById('goBtn').addEventListener('click', loadData);
      document.querySelectorAll('.tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentType = btn.dataset.type;
          renderEvents();
        });
      });
      document.getElementById('monthSelect').addEventListener('change', onMonthChange);
      loadData();
    }

    function buildSelects() {
      const mSel = document.getElementById('monthSelect');
      const dSel = document.getElementById('daySelect');
      MONTHS_CN.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1;
        opt.textContent = name;
        mSel.appendChild(opt);
      });
      updateDaySelect(currentMonth);
      mSel.value = currentMonth;
      dSel.value = currentDay;
    }

    function updateDaySelect(month) {
      const dSel = document.getElementById('daySelect');
      dSel.innerHTML = '';
      for (let d = 1; d <= DAYS_MONTH[month - 1]; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + ' 日';
        dSel.appendChild(opt);
      }
    }

    function onMonthChange() {
      currentMonth = parseInt(document.getElementById('monthSelect').value);
      updateDaySelect(currentMonth);
    }

    function setMonthDay(m, d) {
      currentMonth = m; currentDay = d;
      document.getElementById('monthSelect').value = m;
      document.getElementById('monthSelect').dispatchEvent(new Event('change'));
      document.getElementById('daySelect').value = d;
    }

    function mmdd(month, day) {
      return String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    }

    function loadData() {
      updateHero();
      renderEvents();
    }

    function updateHero() {
      document.getElementById('heroSubtitle').textContent = MONTHS_CN[currentMonth-1] + ' ' + currentDay + ' 日';
      document.getElementById('heroMeta').textContent = MONTHS_EN[currentMonth-1] + ' ' + currentDay;
      const data = ALL_DATA[mmdd(currentMonth,currentDay)];
      if (data) {
        document.getElementById('statEvents').textContent = (data.events||[]).length;
        document.getElementById('statBirths').textContent = (data.births||[]).length;
        document.getElementById('statDeaths').textContent = (data.deaths||[]).length;
      }
    }

    function showEmpty(msg) {
      document.getElementById('timeline').innerHTML = '<div class="empty-state">'+msg+'</div>';
    }

    function renderEvents() {
      const sectionTitles = { selected: '历史长河', births: '今日出生', deaths: '今日逝世' };
      document.getElementById('sectionTitle').textContent = sectionTitles[currentType] || '';
      const mm = mmdd(currentMonth, currentDay);
      const data = ALL_DATA[mm];
      if (!data) { showEmpty('暂无数据'); return; }
      let items = data[currentType] || [];
      if (currentType === 'selected') items = items.filter(it => it.year);
      if (items.length === 0) { showEmpty('暂无数据'); return; }
      const html = items.map((it, i) => {
        if (currentType === 'selected') {
          const tag = it.cls || 'world';
          const tagLabels = {china:'中国史',world:'世界史',military:'军事',science:'科技',culture:'文化'};
          return '<div class="event" style="transition-delay:'+i*0.04+'s">'+
            '<div class="event-year">'+it.year+'</div>'+
            '<div class="event-title">'+it.text+'</div>'+
            '<div class="event-tags"><span class="tag tag-'+tag+'">'+tagLabels[tag]+'</span></div>'+
            '</div>';
        } else {
          return '<div class="event" style="transition-delay:'+i*0.04+'s">'+
            '<div class="event-year">'+it.year+' · '+(currentType==='births'?'出生':'逝世')+'</div>'+
            '<div class="event-title">'+(it.name||it.text||'')+'</div>'+
            (it.desc?'<div class="event-desc">'+it.desc+'</div>':'')+
            '</div>';
        }
      }).join('');
      document.getElementById('timeline').innerHTML = html;
      // Scroll reveal
      setTimeout(() => {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.event').forEach(el => observer.observe(el));
        document.querySelectorAll('.event').forEach((el, i) => el.style.transitionDelay = i*0.04+'s');
      }, 10);
    }

    init();
  })();
</script>
</body>
</html>
